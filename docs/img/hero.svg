<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Developer workspace illustration">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F9D8A"/>
      <stop offset="1" stop-color="#E8647C"/>
    </linearGradient>
  </defs>

  <!-- soft background blobs -->
  <circle cx="110" cy="90" r="70" fill="#0F9D8A" opacity="0.08"/>
  <circle cx="540" cy="110" r="90" fill="#E8647C" opacity="0.09"/>

  <!-- floating code symbols -->
  <g font-family="Fira Code, Consolas, monospace" font-weight="700" fill="url(#g)">
    <text x="70" y="70" font-size="34" opacity="0.55">{ }</text>
    <text x="520" y="64" font-size="30" opacity="0.55">&lt;/&gt;</text>
    <text x="548" y="186" font-size="28" opacity="0.45">API</text>
    <text x="48" y="190" font-size="26" opacity="0.45">SQL</text>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="5s" repeatCount="indefinite"/>
  </g>

  <!-- laptop screen -->
  <rect x="190" y="50" width="260" height="170" rx="12" fill="#1B2B34"/>
  <rect x="200" y="60" width="240" height="150" rx="6" fill="#12202A"/>
  <circle cx="213" cy="73" r="3.5" fill="#E8647C"/>
  <circle cx="225" cy="73" r="3.5" fill="#F4C95D"/>
  <circle cx="237" cy="73" r="3.5" fill="#0F9D8A"/>

  <!-- code lines -->
  <g stroke-linecap="round" stroke-width="6">
    <line x1="214" y1="98"  x2="262" y2="98"  stroke="#E8647C"/>
    <line x1="270" y1="98"  x2="326" y2="98"  stroke="#7FD1C4"/>
    <line x1="230" y1="116" x2="300" y2="116" stroke="#9AA9B4"/>
    <line x1="308" y1="116" x2="352" y2="116" stroke="#F4C95D"/>
    <line x1="230" y1="134" x2="284" y2="134" stroke="#7FD1C4"/>
    <line x1="292" y1="134" x2="378" y2="134" stroke="#9AA9B4"/>
    <line x1="246" y1="152" x2="318" y2="152" stroke="#E8647C"/>
    <line x1="326" y1="152" x2="364" y2="152" stroke="#9AA9B4"/>
    <line x1="230" y1="170" x2="268" y2="170" stroke="#F4C95D"/>
    <line x1="214" y1="188" x2="250" y2="188" stroke="#7FD1C4"/>
  </g>
  <!-- blinking cursor -->
  <rect x="258" y="181" width="8" height="14" fill="#E8647C">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- laptop base -->
  <path d="M170 224 H470 L456 240 Q454 244 450 244 H190 Q186 244 184 240 Z" fill="#C9D3D9"/>
  <rect x="285" y="224" width="70" height="6" rx="3" fill="#A9B6BE"/>

  <!-- desk -->
  <rect x="90" y="244" width="460" height="8" rx="4" fill="url(#g)" opacity="0.85"/>
  <rect x="130" y="252" width="8" height="52" fill="#B7C3CA"/>
  <rect x="502" y="252" width="8" height="52" fill="#B7C3CA"/>

  <!-- coffee mug -->
  <rect x="110" y="214" width="34" height="30" rx="6" fill="#FFFFFF" stroke="#C9D3D9" stroke-width="2"/>
  <path d="M144 222 q14 0 14 9 q0 9 -14 9" fill="none" stroke="#C9D3D9" stroke-width="3"/>
  <g fill="none" stroke="#9AA9B4" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
    <path d="M120 206 q-5 -8 0 -16 q5 -8 0 -16">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M132 206 q-5 -8 0 -16 q5 -8 0 -16">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- plant -->
  <path d="M488 244 l6 -30 h30 l6 30 z" fill="#E8647C" opacity="0.9"/>
  <g fill="#0F9D8A">
    <ellipse cx="509" cy="196" rx="8" ry="20"/>
    <ellipse cx="494" cy="202" rx="7" ry="17" transform="rotate(-30 494 202)"/>
    <ellipse cx="524" cy="202" rx="7" ry="17" transform="rotate(30 524 202)"/>
  </g>
</svg>
