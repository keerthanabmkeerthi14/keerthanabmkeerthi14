<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="Engineering principles">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0F9D8A"/><stop offset="1" stop-color="#E8647C"/></linearGradient></defs>
  <text x="500" y="26" text-anchor="middle" font-family="Consolas, monospace" font-size="14" letter-spacing="4" fill="#0F9D8A">// ENGINEERING PRINCIPLES</text>
  <g transform="translate(12 40)">
    <rect width="235" height="150" rx="14" fill="#0F1B24" stroke="url(#g)" stroke-width="2"/>
    <rect x="18" y="20" width="34" height="5" rx="2.5" fill="url(#g)"/>
    <text x="18" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Reliable by default</text>
    <text x="18" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#B8C7D1">Validate input, handle failures</text>
    <text x="18" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#B8C7D1">and test the unhappy paths.</text>
  </g>
  <g transform="translate(259 40)">
    <rect width="235" height="150" rx="14" fill="#0F1B24" stroke="url(#g)" stroke-width="2"/>
    <rect x="18" y="20" width="34" height="5" rx="2.5" fill="url(#g)"/>
    <text x="18" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Built to scale</text>
    <text x="18" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#B8C7D1">Stateless services, with caching</text>
    <text x="18" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#B8C7D1">and queues where they earn it.</text>
  </g>
  <g transform="translate(506 40)">
    <rect width="235" height="150" rx="14" fill="#0F1B24" stroke="url(#g)" stroke-width="2"/>
    <rect x="18" y="20" width="34" height="5" rx="2.5" fill="url(#g)"/>
    <text x="18" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Clean &amp; maintainable</text>
    <text x="18" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#B8C7D1">Clear names, small modules and</text>
    <text x="18" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#B8C7D1">docs a teammate can follow.</text>
  </g>
  <g transform="translate(753 40)">
    <rect width="235" height="150" rx="14" fill="#0F1B24" stroke="url(#g)" stroke-width="2"/>
    <rect x="18" y="20" width="34" height="5" rx="2.5" fill="url(#g)"/>
    <text x="18" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Observable</text>
    <text x="18" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#B8C7D1">Logs, metrics and health checks</text>
    <text x="18" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#B8C7D1">so problems show up early.</text>
  </g>
</svg>